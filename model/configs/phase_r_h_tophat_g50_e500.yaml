# r-h phase diagram with top-hat Phi(p), matching existing small-ensemble runs.
#
# Unified small-run convention:
#   r grid: 50 points from 0 to 1
#   h grid: 50 points from 0 to 0.2
#   ensemble: 500 communities per grid point

extends: phase_r_h_tophat.yaml

scan:
  name: phase_r_h
  x_axis: r_mean
  y_axis: h_stress
  r_min: 0.0
  r_max: 1.0
  h_min: 0.0
  h_max: 0.2
  n_grid: 50

simulation:
  n_ensemble: 500
  seed_base: 910000000

output:
  run_dir: data/runs/rh_gm8p10_tophat_S12_g50_e500
