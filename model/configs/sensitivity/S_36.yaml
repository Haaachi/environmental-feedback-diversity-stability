# Sensitivity: 36 species (3x baseline diversity).
# Tests how larger species pools shift phase boundaries.

extends: ../base.yaml

model:
  S: 36

scan:
  name: phase_r_h
  x_axis: r_mean
  y_axis: h_stress
  r_min: 0.0
  r_max: 1.0
  h_min: 0.0
  h_max: 0.2
  n_grid: 50

fixed:
  f: 0.03333333333333333

simulation:
  seed_base: 500000000
  n_ensemble: 500

output:
  run_dir: data/runs/sensitivity/S_36
