# Sensitivity: dense (generalist) resource preferences.
# Every species can consume all 24 resources with random
# Dirichlet-distributed weights. Tests whether niche
# partitioning (sparse links) is necessary for the phase structure.

extends: ../base.yaml

traits:
  preference_model: dense_dirichlet

scan:
  name: phase_r_h
  x_axis: r_mean
  y_axis: h_stress
  r_min: 0.0
  r_max: 1.0
  h_min: 0.0
  h_max: 0.2
  n_grid: 50

fixed:
  f: 0.03333333333333333

simulation:
  seed_base: 700000000
  n_ensemble: 500

output:
  run_dir: data/runs/sensitivity/dense_pref
