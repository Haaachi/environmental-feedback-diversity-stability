# Sensitivity: homogeneous growth rates (CV=0).
# Control: without growth rate heterogeneity,
# complexity-driven fluctuations should be absent.

extends: ../base.yaml

traits:
  growth_cv: 0.0

scan:
  name: phase_r_h
  x_axis: r_mean
  y_axis: h_stress
  r_min: 0.0
  r_max: 1.0
  h_min: 0.0
  h_max: 0.2
  n_grid: 50

fixed:
  f: 0.03333333333333333

simulation:
  seed_base: 100000000
  n_ensemble: 500

output:
  run_dir: data/runs/sensitivity/growth_cv_00
