# Generic r-h phase-diagram template: mean growth rate (r) x
# pH-mediated death (h).
#
# The manuscript main result is not this bare template; it is the
# gamma-normal sd3/R1 h <= 0.15, e5000 configuration:
#   configs/phase_r_h_gnormal_sd3_R1_sparse6_tri_S12_h015_e5000.yaml

extends: base.yaml

scan:
  name: phase_r_h
  x_axis: r_mean
  y_axis: h_stress
  r_min: 0.0
  r_max: 1.0
  h_min: 0.0
  h_max: 0.2
  n_grid: 100

fixed:
  f: 0.03333333333333333   # 1/30 dilution

output:
  run_dir: data/runs/rh_gm8p10_tri_S12_g100_e1000
