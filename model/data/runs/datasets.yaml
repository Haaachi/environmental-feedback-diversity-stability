version: 2
default_dataset: rh_gnormal_sd3_R1_sparse6_tri_S12_h015_g100_e5000

conventions:
  naming:
    rule: parameter_first
    avoid_terms:
      - main
      - baseline
      - v2_main
    pattern: "{scan}_{gamma}_{phi}_{S}_{grid}_{ens}_{tag}"
  tokens:
    scans:
      rh: r_mean x h_stress
      hf: h_stress x dilution fraction
      rf: r_mean x dilution fraction
    gamma:
      gm8p10: linear gradient [-8,+10]
      gm5p5: linear gradient [-5,+5]
      gm5p10: linear gradient [-5,+10]
      gm10p10: linear gradient [-10,+10]
      g0: gamma = 0
      gnormal_sd3: per-community Normal(0,3^2)
      gnormal_sd5: per-community Normal(0,5^2)
      ggrp_8_4_12: grouped gamma {-8 x8, 0 x4, +10 x12}
    phi:
      tri: triangular Phi(p)
      tophat: top-hat Phi(p)
    grid:
      g100: 100 x 100 grid
      g50: 50 x 50 grid
      h100_f5: 100 h values x 5 f values
    ensemble:
      e1000: 1000 communities per grid point
      e500: 500 communities per grid point
      e5000: 5000 communities per grid point
  plotting:
    canonical_out_root: figures/main_stability_diversity
    cv_threshold: 0.1
    osc_frac_min: 0.1
    readout: B

datasets:
  rh_gnormal_sd3_R1_sparse6_tri_S12_g100_e1000:
    role: supporting_broad_h_scan
    current_root: data/runs/rh_gnormal_sd3_R1_sparse6_tri_S12_g100_e1000
    canonical_root: data/runs/rh_gnormal_sd3_R1_sparse6_tri_S12_g100_e1000
    canonical_plot_dir: figures/main_stability_diversity/rh_gnormal_sd3_R1_sparse6_tri_S12_g100_e1000_cv010
    status: external_complete
    scan: rh
    phi: tri
    parameters:
      S: 12
      M: 24
      gamma: {mode: normal_per_community, mean: 0.0, sd: 3.0}
      R0: 1.0
      growth_cv: 0.3
      resource_degree: 6
      preference_model: sparse_random_links
      r_range: [0.0, 1.0]
      h_range: [0.0, 0.2]
      grid: 100
      f: 0.03333333333333333
      n_cycles: 30
      n_saved_days: 10
      n_ensemble: 1000
      seed_base: 0
    phases:
      phase_r_h:
        meta: phase_r_h_meta.h5
        processed: processed/phase_r_h_metrics_last3.npz
        processed_last10: processed/phase_r_h_metrics_last10.npz
